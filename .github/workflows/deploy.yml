name: Deploy to Netcup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NETCUP_SSH_HOST }}
          username: ${{ secrets.NETCUP_SSH_USER }}
          password: ${{ secrets.NETCUP_SSH_PASSWORD }}
          source: "frontend/dist/."
          target: "${{ secrets.NETCUP_REMOTE_PATH }}"
          strip_components: 2
          rm: false

      - name: Smoke Test
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.HTPASSWD_USER }}:${{ secrets.HTPASSWD_PASS }}" \
            "https://${{ secrets.NETCUP_DOMAIN }}")
          echo "HTTP Status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Smoke test failed" && exit 1)
